# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# A Render Blueprint: one web service (this repository's Dockerfile) and one Postgres database, both in
# Singapore. Render > New > Blueprint > pick the repository. The values marked `sync: false` are asked for
# when the Blueprint is created and are never overwritten by a later sync; see deployment.doc.md for what to enter.

databases:
  - name: message-app-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: '18' # the major version the test suite runs on (server/docker-compose.test.yml)
    databaseName: message_app
    user: message_app
    ipAllowList: [] # nothing outside Render may connect; add your own address when you need a pg_dump from your computer

services:
  - type: web
    name: message-app
    runtime: docker
    region: singapore
    plan: starter # always on: a free web service sleeps after 15 minutes, which closes every socket
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health # does not touch the database, so a database outage does not restart the server
    preDeployCommand: npx prisma migrate deploy # runs on the new version before traffic moves to it; a failure cancels the deploy
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: message-app-db
          property: connectionString
      - key: TRUST_PROXY # how many proxies are in front: '1' on Render, but check it (LOG_CLIENT_IP, deployment.doc.md)
        sync: false
      - key: APP_ORIGIN # https://your-domain, no path and no trailing slash
        sync: false
      - key: EMAIL_VERIFICATION_URL # https://your-domain/verify-email
        sync: false
      - key: PASSWORD_RESET_URL # https://your-domain/reset-password
        sync: false
      - key: MAIL_TRANSPORT
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM # 'Message App <no-reply@your-domain>', on a domain verified in Resend
        sync: false
      - key: SESSION_COOKIE # the __Host- prefix makes a browser refuse the cookie unless it is Secure, for this host only
        value: __Host-session
