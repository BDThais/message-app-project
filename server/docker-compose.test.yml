services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chatapp_test
      POSTGRES_USER: chatapp_test
      POSTGRES_PASSWORD: chatapp_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp_test -d chatapp_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - chatapp_test_data:/var/lib/postgresql

volumes:
  chatapp_test_data: